
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050914">
  <title>PARTH JARVIS</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #102b4c, #050914 65%);
      color: #eaf7ff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #16436b;
    }

    .logo {
      color: #43caff;
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .online {
      color: #4be7b1;
      font-size: 11px;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 25px 16px;
      text-align: center;
    }

    h2 {
      color: #a9dcff;
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 3px;
    }

    .core {
      width: 155px;
      height: 155px;
      border: 2px solid #25baff;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 35px auto 20px;
      box-shadow: 0 0 25px #008cff, inset 0 0 25px #087dcb;
      animation: pulse 3s infinite;
    }

    .core span {
      font-size: 48px;
      color: #66dfff;
      text-shadow: 0 0 20px #00aaff;
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 45px #008cff, inset 0 0 35px #087dcb;
      }
    }

    #status {
      color: #58ceff;
      font-size: 12px;
      letter-spacing: 2px;
      margin: 20px 0;
      overflow-wrap: anywhere;
    }

    .panel {
      background: #0b1728;
      border: 1px solid #16436b;
      border-radius: 15px;
      padding: 16px;
      text-align: left;
      margin-top: 25px;
    }

    .panel h3 {
      color: #55caff;
      font-size: 14px;
      letter-spacing: 2px;
    }

    #chat {
      height: 280px;
      overflow-y: auto;
      line-height: 1.6;
      font-size: 14px;
    }

    .message {
      margin: 12px 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user { color: #69d6ff; }
    .jarvis { color: #c3d7ed; }

    .controls {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: #101f32;
      color: white;
      border: 1px solid #28608d;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
    }

    button {
      background: #087dce;
      border: none;
      color: white;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: wait; }

    .voice {
      width: 100%;
      margin-top: 12px;
      padding: 16px;
      background: #075c9c;
      letter-spacing: 1px;
    }

    .small {
      text-align: center;
      color: #829bb8;
      font-size: 11px;
      margin: 25px 0;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">PARTH JARVIS</div>
  <div class="online" id="connectionStatus">● SYSTEM READY</div>
</header>

<main>
  <h2>PERSONAL AI ASSISTANT</h2>

  <div class="core"><span>J</span></div>

  <div id="status" role="status" aria-live="polite">
    READY FOR YOUR COMMAND
  </div>

  <section class="panel">
    <h3>AI COMMUNICATION CENTER</h3>

    <div id="chat" aria-live="polite">
      <div class="message jarvis">
JARVIS: Hello! I am PARTH JARVIS, your personal AI assistant. How can I help you today?
      </div>
    </div>

    <div class="controls">
      <input
        id="userInput"
        placeholder="Ask anything..."
        autocomplete="off"
        aria-label="Your message"
      >
      <button id="sendButton" onclick="sendMessage()">
        SEND
      </button>
    </div>

    <button class="voice" id="talkButton" onclick="startListening()">
      🎙 TALK TO JARVIS
    </button>

    <button
      class="voice"
      onclick="stopSpeaking()"
      style="background:#263e58"
    >
      STOP VOICE
    </button>

    <button class="voice" id="speakReplyButton" onclick="speakLastReply()" style="background:#087dce">
      🔊 SPEAK REPLY
    </button>
  </section>

  <div class="small">
    PARTH JARVIS • PERSONAL AI ASSISTANT<br>
    VERSION 4.0 • GEMINI AI + VOICE
  </div>
</main>

<script>
"use strict";

// Cloudflare Worker endpoint.
// Gemini API key stays securely in the Worker secret.
const API_URL =
  "https://parth-jarvis-api.kangralkarparth1.workers.dev/";

const chat = document.getElementById("chat");
const statusText = document.getElementById("status");
const input = document.getElementById("userInput");
const sendButton = document.getElementById("sendButton");
const talkButton = document.getElementById("talkButton");
const connectionStatus =
  document.getElementById("connectionStatus");

let recognition = null;
let listening = false;
let busy = false;
let currentSpeech = null;

function setStatus(message) {
  statusText.textContent = message;
}

function addMessage(type, text) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent =
    (type === "user" ? "YOU: " : "JARVIS: ") + text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

// Keep the latest successful reply so iPhone users can replay it with a tap.
let lastJarvisReply = "";

function speak(text) {
  if (!("speechSynthesis" in window) ||
      !("SpeechSynthesisUtterance" in window)) {
    setStatus("VOICE OUTPUT NOT SUPPORTED");
    return;
  }

  const synth = window.speechSynthesis;
  synth.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  currentSpeech = utterance;
  utterance.lang = "en-IN";
  utterance.rate = 0.95;
  utterance.pitch = 1;
  utterance.volume = 1;

  // Prefer an English voice that this browser actually provides.
  const voices = synth.getVoices();
  const voice = voices.find(v => v.lang === "en-IN") ||
                voices.find(v => v.lang === "en-US") ||
                voices.find(v => v.lang.toLowerCase().startsWith("en"));
  if (voice) utterance.voice = voice;

  utterance.onstart = function() {
    setStatus("JARVIS IS SPEAKING...");
  };
  utterance.onend = function() {
    if (currentSpeech === utterance) {
      currentSpeech = null;
      if (!busy) setStatus("READY FOR YOUR COMMAND");
    }
  };
  utterance.onerror = function(event) {
    if (currentSpeech !== utterance) return;
    currentSpeech = null;
    if (event.error !== "canceled" && event.error !== "interrupted") {
      console.warn("JARVIS speech error:", event.error);
      setStatus("VOICE ERROR: " + event.error);
    }
  };

  try {
    synth.speak(utterance);
  } catch (error) {
    currentSpeech = null;
    console.warn("JARVIS speech failed:", error);
    setStatus("VOICE PLAYBACK FAILED");
  }
}

function speakLastReply() {
  if (!lastJarvisReply) {
    setStatus("ASK JARVIS SOMETHING FIRST");
    return;
  }
  // Called directly by a tap, which may be required for iPhone playback.
  speak(lastJarvisReply);
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  currentSpeech = null;

  if (recognition && listening) {
    recognition.stop();
  }

  if (!busy) {
    setStatus("READY FOR YOUR COMMAND");
  }
}

async function sendMessage() {
  const message = input.value.trim();

  if (!message || busy) return;

  busy = true;
  sendButton.disabled = true;
  talkButton.disabled = true;

  addMessage("user", message);
  input.value = "";

  setStatus("JARVIS IS THINKING...");
  connectionStatus.textContent = "● AI PROCESSING";

  const thinking = addMessage(
    "jarvis",
    "Thinking..."
  );

  try {
    const controller = new AbortController();
    const timeout = setTimeout(
      () => controller.abort(),
      90000
    );

    let response;

    try {
      response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message }),
        signal: controller.signal
      });
    } finally {
      clearTimeout(timeout);
    }

    const rawText = await response.text();

    let data;

    try {
      data = JSON.parse(rawText);
    } catch {
      throw new Error(
        "Server returned an invalid response. " +
        "Check your Cloudflare Worker."
      );
    }

    if (!response.ok) {
      throw new Error(
        data.error ||
        "AI server error (" + response.status + ")"
      );
    }

    const reply =
      typeof data.reply === "string"
        ? data.reply.trim()
        : "";

    if (!reply) {
      throw new Error(
        "AI returned an empty reply. Check the Worker response."
      );
    }

    thinking.textContent = "JARVIS: " + reply;
    chat.scrollTop = chat.scrollHeight;

    setStatus("READY FOR YOUR COMMAND");
    connectionStatus.textContent = "● AI CONNECTED";

    lastJarvisReply = reply;
    speak(reply);

  } catch (error) {
    let message = error.message || "Unknown error";

    if (error.name === "AbortError") {
      message = "The AI request timed out. Please try again.";
    } else if (error instanceof TypeError) {
      message =
        "Cannot reach the AI server. Check the Worker URL, " +
        "internet connection, and CORS settings.";
    }

    thinking.textContent = "JARVIS: ERROR: " + message;
    chat.scrollTop = chat.scrollHeight;

    setStatus("AI CONNECTION ERROR");
    connectionStatus.textContent = "● CONNECTION ERROR";

    console.error("JARVIS request failed:", error);

  } finally {
    busy = false;
    sendButton.disabled = false;
    talkButton.disabled = false;
    input.focus();
  }
}

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.repeat) {
    event.preventDefault();
    sendMessage();
  }
});

function startListening() {
  if (busy || listening) return;

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!Recognition) {
    setStatus("VOICE NOT SUPPORTED");
    addMessage(
      "jarvis",
      "This browser does not support speech recognition. " +
      "You can still type messages. Try an updated " +
      "Chrome browser on desktop or Android."
    );
    return;
  }

  if (!window.isSecureContext) {
    setStatus("SECURE CONNECTION REQUIRED");
    addMessage(
      "jarvis",
      "Microphone recognition requires a secure HTTPS page."
    );
    return;
  }

  stopSpeaking();

  recognition = new Recognition();
  recognition.lang = "en-IN";
  recognition.interimResults = false;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = function() {
    listening = true;
    setStatus("LISTENING...");
    talkButton.textContent = "🎙 LISTENING...";
  };

  recognition.onresult = function(event) {
    const transcript =
      event.results[0][0].transcript.trim();

    if (transcript) {
      input.value = transcript;
      setStatus("VOICE RECOGNIZED");
      sendMessage();
    }
  };

  recognition.onerror = function(event) {
    listening = false;

    talkButton.textContent = "🎙 TALK TO JARVIS";
    setStatus("VOICE ERROR: " + event.error);

    let explanation =
      "Speech recognition error: " + event.error;

    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      explanation =
        "Microphone access was denied or speech recognition " +
        "was blocked. Check Chrome microphone permissions " +
        "and your operating system's microphone settings.";
    } else if (event.error === "no-speech") {
      explanation =
        "I could not hear speech. Please try again.";
    } else if (event.error === "network") {
      explanation =
        "The speech recognition service had a network error.";
    } else if (event.error === "audio-capture") {
      explanation =
        "No working microphone was detected.";
    }

    addMessage("jarvis", explanation);
  };

  recognition.onend = function() {
    listening = false;
    talkButton.textContent = "🎙 TALK TO JARVIS";

    if (statusText.textContent === "LISTENING...") {
      setStatus("READY FOR YOUR COMMAND");
    }
  };

  try {
    recognition.start();
  } catch (error) {
    listening = false;
    talkButton.textContent = "🎙 TALK TO JARVIS";
    setStatus("VOICE START FAILED");

    addMessage(
      "jarvis",
      error.message || "Unable to start microphone."
    );
  }
}
</script>

</body>
</html>
